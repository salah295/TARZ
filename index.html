<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SALEM — Catalogue</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KPHG07S9VJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KPHG07S9VJ');
</script>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-dar">SALEM</span>
        <span class="logo-name">Catalogue</span>
        <p class="logo-subtitle">Catalogue de tenues traditionnelles marocaines</p>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="6"/><path d="M15 15l-3-3"/>
        </svg>
        <input type="text" id="search" placeholder="Rechercher un modèle ou numéro…" />
      </div>
    </div>
  </header>

  <nav class="filters">
    <div class="filter-section">
      <span class="filter-label">Type</span>
      <div class="chip-group" id="type-chips">
        <button class="chip active" data-type="all">Tous</button>
        <button class="chip caftan" data-type="Caftan">Caftan</button>
        <button class="chip jellaba" data-type="Jellaba">Jellaba</button>
        <button class="chip tackchita" data-type="Tackchita">Tackchita</button>
      </div>
    </div>
    <div class="filter-section">
      <span class="filter-label">Année</span>
      <div class="chip-group" id="year-chips">
        <button class="chip active" data-year="all">Toutes</button>
        <button class="chip" data-year="2020">2020</button>
        <button class="chip" data-year="2021">2021</button>
        <button class="chip" data-year="2022">2022</button>
        <button class="chip" data-year="2023">2023</button>
        <button class="chip" data-year="2024">2024</button>
        <button class="chip" data-year="2025">2025</button>
        <button class="chip" data-year="2026">2026</button>
      </div>
    </div>
    <button class="reset-btn" id="reset-btn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="13" height="13">
        <path d="M2 8a6 6 0 1 0 1-3.5"/><path d="M2 4v4h4"/>
      </svg>
      Réinitialiser
    </button>
  </nav>

  <div class="stats-bar">
    <span id="stats-text"></span>
  </div>

  <a class="floating-whatsapp" href="https://wa.me/212600359099" target="_blank" rel="noopener" aria-label="Contacter sur WhatsApp au 0600359099">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.1 1.6 5.9L.2 24l6.5-1.7a11.8 11.8 0 0 0 5.4 1.3h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.1-1.2-6.1-3.5-8.3ZM12.2 21.5h-.1c-1.7 0-3.4-.5-4.8-1.3l-.3-.2-3.8 1 1-3.7-.2-.3a9.7 9.7 0 0 1-1.5-5.2C2.5 6.5 6.9 2 12.2 2c2.6 0 5 1 6.8 2.8a9.6 9.6 0 0 1 2.8 6.9c0 5.3-4.3 9.8-9.6 9.8Zm5.3-7.3c-.3-.2-1.8-.9-2.1-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.5-1.6-.9-.8-1.6-1.8-1.8-2.1-.2-.3 0-.5.2-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6-.1-.2-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1-1.1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.1-1.4-.1-.1-.3-.2-.6-.4Z"/>
    </svg>
    <span>WhatsApp</span>
  </a>

  <main class="grid" id="grid">
    <article class="card skeleton-card">
      <div class="card-img skeleton-img"></div>
      <div class="card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </article>
    <article class="card skeleton-card">
      <div class="card-img skeleton-img"></div>
      <div class="card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </article>
    <article class="card skeleton-card">
      <div class="card-img skeleton-img"></div>
      <div class="card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </article>
    <article class="card skeleton-card">
      <div class="card-img skeleton-img"></div>
      <div class="card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </article>
    <article class="card skeleton-card">
      <div class="card-img skeleton-img"></div>
      <div class="card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </article>
    <article class="card skeleton-card">
      <div class="card-img skeleton-img"></div>
      <div class="card-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </article>
  </main>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-label="Détail du produit">
    <div class="modal-card" id="modal-content">
      <button class="modal-close-btn" id="modal-close" aria-label="Fermer">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M3 3l10 10M13 3L3 13"/>
        </svg>
      </button>
      <button class="modal-nav-btn modal-nav-prev" id="modal-prev" aria-label="Produit précédent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <button class="modal-nav-btn modal-nav-next" id="modal-next" aria-label="Produit suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <div class="modal-img" id="m-img"></div>
      <div class="modal-body">
        <div class="modal-badge" id="m-badge"></div>
        <h2 class="modal-title" id="m-name"></h2>
        <div class="modal-details">
          <div class="detail-row"><span class="detail-key">Numéro</span><span class="detail-val" id="m-num"></span></div>
          <div class="detail-row"><span class="detail-key">Type</span><span class="detail-val" id="m-type"></span></div>
          <div class="detail-row"><span class="detail-key">Année</span><span class="detail-val" id="m-year"></span></div>
        </div>
        <div class="modal-price-row">
          <div class="modal-price" id="m-price"></div>
          <div class="modal-action-group">
            <button type="button" class="modal-download-btn" id="m-download" aria-label="Télécharger">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                <path d="M10 3v10M6 9l4 4 4-4"/>
                <path d="M3 15v2h14v-2"/>
              </svg>
            </button>
            <a class="modal-whatsapp-btn" id="m-whatsapp" target="_blank" rel="noopener">
              Commander via WhatsApp
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal mot de passe téléchargement -->
  <div class="modal-backdrop" id="download-modal" role="dialog" aria-modal="true" aria-label="Mot de passe">
    <div class="modal-card pwd-modal">
      <button class="modal-close-btn" onclick="closeDownloadModal()" aria-label="Fermer">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M3 3l10 10M13 3L3 13"/>
        </svg>
      </button>
      <div class="pwd-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h3 class="pwd-title">Mot de passe requis</h3>
      <p class="pwd-desc">Entrez le mot de passe pour télécharger le fichier.</p>
      <input type="password" id="download-pwd" class="pwd-input" placeholder="Mot de passe" 
             onkeydown="if(event.key==='Enter') confirmDownload()" />
      <p class="pwd-error" id="pwd-error"></p>
      <button class="pwd-btn" onclick="confirmDownload()">Télécharger</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
